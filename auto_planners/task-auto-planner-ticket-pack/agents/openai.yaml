interface:
  display_name: "Task Auto Planner Ticket Pack"
  short_description: "Plan and dispatch non-coding ticket packs, preferring Claude/Codex CLI worker lanes with spawned fallback when those runtimes are unavailable or flaky"
  default_prompt: "Use $task-auto-planner-ticket-pack to create a rigorous non-coding ticket pack or ticket-pack set for research, aggregation, drafting, review, and finishing work, then dispatch it through role-locked orchestrators without doing the substantive lane work directly. Prefer the skill's Claude/Codex CLI worker contracts first, and only fall back to spawned child workers when the preferred CLI runtime is unavailable, flaky, or unrecoverable."
